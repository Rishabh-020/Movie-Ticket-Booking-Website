<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook - Seat Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            background-image:
                radial-gradient(ellipse 80% 90% at 10% 50%, rgba(220, 38, 38, 0.15), transparent 70%),
                radial-gradient(ellipse 50% 60% at 90% 90%, rgba(220, 38, 38, 0.2), transparent 70%),
                radial-gradient(ellipse 100% 50% at 50% 0%, rgba(220, 38, 38, 0.1), transparent 60%);
            background-attachment: fixed;
        }
        .screen-arc {
            width: 90%;
            max-width: 600px;
            height: 70px;
            border-top: 4px solid #ef4444;
            border-radius: 50% / 100% 100% 0 0;
            transform: rotateX(-35deg) scale(1.05);
            box-shadow: 0 10px 40px -10px rgba(239, 68, 68, 0.6);
        }
        .seat {
            transition: all 0.2s ease-in-out;
        }
        .seat:not(.occupied):hover {
            transform: scale(1.1) translateY(-2px);
        }
        .glass-effect {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #seat-map::-webkit-scrollbar {
            display: none;
        }
        #seat-map {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pop {
            0% { transform: scale(1.1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1.1); }
        }
        .seat-pop {
            animation: pop 0.2s ease-out;
        }
        #modal {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .seat .seat-number {
            font-family: 'Inter', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            fill: #ffffff;
        }
        .seat.premium:not(.selected) .seat-number {
            fill: #111827;
        }
        .seat.standard:not(.selected) .seat-number {
            fill: #e5e7eb;
        }
        .seat.occupied .seat-number {
            fill: #4b5563;
        }
        .btn-gradient {
            background-image: linear-gradient(to right, #ef4444, #dc2626);
        }
        .btn-gradient:hover {
            background-image: linear-gradient(to right, #dc2626, #b91c1c);
        }

        /* === NEW CSS FOR HOVER EFFECT === */
        .ticket-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 15px;
            background: linear-gradient(to right, #1f2937, #111827);
            border: 1px solid #374151;
            transition: all 0.3s ease;
        }
        .ticket-icon-container {
            width: 32px;
            height: 32px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ticket-stub {
            width: 85%;
            height: auto;
            position: absolute;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            fill: #9ca3af;
        }
        .ticket-stub.back {
            z-index: 1;
        }
        .ticket-stub.middle {
            z-index: 2;
        }
        .ticket-stub.front {
            z-index: 3;
            transform-origin: bottom;
        }
        .ticket-btn:hover {
            background: linear-gradient(to right, #374151, #1f2937);
            border-color: #6b7280;
        }
        .ticket-btn:hover .ticket-stub.middle {
            transform: translateY(-4px);
        }
        .ticket-btn:hover .ticket-stub.front {
            transform: rotateX(25deg) translateY(-2px);
        }
        .ticket-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="text-gray-300 flex items-center justify-center min-h-screen">

    <main class="container mx-auto px-4 py-6 md-py-10 flex flex-col lg:flex-row gap-8 md:gap-12 w-full">
        
        <aside class="w-full lg:w-1/4 lg:max-w-xs flex-shrink-0">
            <div class="glass-effect rounded-xl p-6">
                <h2 class="text-xl font-semibold mb-4 text-white">Show Timings</h2>
                <div class="space-y-4">
                    <div class="timing-slot flex items-center space-x-3 p-3 rounded-lg cursor-pointer hover:bg-gray-700/50 transition-colors" data-time="06:30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span>06:30 AM</span>
                    </div>
                    <div class="timing-slot selected flex items-center space-x-3 p-3 rounded-lg cursor-pointer bg-red-600 text-white font-semibold shadow-lg shadow-red-500/20" data-time="10:30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span>10:30 AM</span>
                    </div>
                    <div class="timing-slot flex items-center space-x-3 p-3 rounded-lg cursor-pointer hover:bg-gray-700/50 transition-colors" data-time="14:00">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span>02:00 PM</span>
                    </div>
                </div>
                <div class="mt-8 border-t border-gray-700 pt-6">
                    <!-- === HTML FOR BUTTON UPDATED HERE === -->
                    <a href="tickets.html" class="ticket-btn w-full h-[45px] text-white font-bold rounded-lg">
                        <div class="ticket-icon-container">
                            <svg class="ticket-stub back" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" /></svg>
                            <svg class="ticket-stub middle" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" /></svg>
                            <svg class="ticket-stub front" viewBox="0 0 20 20"><path d="M2 6a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 100 4v2a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" /></svg>
                        </div>
                        <span>View My Tickets</span>
                    </a>
                </div>
            </div>
        </aside>

        <section class="w-full lg:w-3/4 flex flex-col items-center">
            <h1 class="text-2xl md:text-3xl font-bold text-white mb-6 text-center">Select Your Seat</h1>
            
            <div class="screen-container w-full flex flex-col items-center mb-10 md:mb-12 space-y-2">
                <div class="screen-arc"></div>
                <p class="text-xs sm:text-sm font-medium text-gray-400 tracking-widest opacity-75">SCREEN</p>
            </div>

            <div id="seat-map" class="w-full max-w-4xl lg:max-w-full overflow-x-auto lg:overflow-x-visible pb-2 text-center">
                 <div id="seat-container" class="py-4 px-6 inline-block min-w-max lg:min-w-0">
                 </div>
            </div>

            <div class="mt-10 md:mt-12 w-full max-w-3xl flex flex-col items-center gap-6">
                <div id="legend" class="flex flex-wrap justify-center items-center gap-x-6 gap-y-4">
                </div>
                
                <div id="summary" class="glass-effect rounded-xl p-5 w-full flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                        <span class="text-gray-300">Selected Seats (<strong class="text-red-500 font-bold" id="seat-count">0</strong>)</span>
                        <div class="text-xs text-gray-400 h-4 mt-1" id="selected-seats-info"></div>
                    </div>
                    <div class="text-2xl font-bold text-white">
                        Total: $<span id="total-price">0</span>
                    </div>
                </div>

                <div class="w-full max-w-sm flex flex-col sm:flex-row gap-4">
                    <button id="book-button" class="btn-gradient w-full text-white font-bold py-2 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 disabled:bg-red-800 disabled:opacity-50 disabled:cursor-not-allowed disabled:scale-100 flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 2a2 2 0 00-2 2v1a1 1 0 000 2v1a1 1 0 000 2v1a1 1 0 000 2v1a2 2 0 002 2h10a2 2 0 002-2v-1a1 1 0 000-2V9a1 1 0 000-2V6a1 1 0 000-2V4a2 2 0 00-2-2H5zm11 14H4a1 1 0 01-1-1V4a1 1 0 011-1h12a1 1 0 011 1v12a1 1 0 01-1 1zM9 7a1 1 0 000 2h2a1 1 0 100-2H9z" clip-rule="evenodd" /></svg>
                        Book Tickets
                    </button>
                    <button id="clear-button" class="w-full bg-gradient-to-r from-gray-800 to-gray-900 border border-gray-700 text-white font-bold py-2 px-6 rounded-lg hover:from-gray-700 hover:to-gray-800 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-gray-800">
                        Clear
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- UPI Payment Modal -->
    <div id="payment-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-gray-900 rounded-2xl max-w-md w-full border border-gray-700 shadow-2xl">
            <!-- Header -->
            <div class="bg-gradient-to-r from-red-600 to-red-700 p-5 rounded-t-2xl">
                <h2 class="text-white text-xl font-bold text-center">Complete Payment</h2>
            </div>

            <!-- Body -->
            <div class="p-6 space-y-5">
                <!-- Booking Summary -->
                <div class="bg-gray-800 p-4 rounded-xl space-y-2 border border-gray-700">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400">Show Time:</span>
                        <span class="text-white font-semibold" id="payment-time">10:30 AM</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400">Seats:</span>
                        <span class="text-white font-semibold" id="payment-seats">-</span>
                    </div>
                    <div class="border-t border-gray-700 pt-2 mt-2">
                        <div class="flex justify-between">
                            <span class="text-white font-semibold">Total Amount:</span>
                            <span class="text-red-500 text-xl font-bold" id="payment-total">$0</span>
                        </div>
                    </div>
                </div>

                <!-- UPI Payment -->
                <div>
                    <label class="block text-white text-sm mb-3 font-semibold">
                        <svg xmlns="http://www.w3.org/2000/svg" class="inline h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z" />
                        </svg>
                        UPI Payment
                    </label>
                    <input type="text" id="upi-id" placeholder="Enter UPI ID (e.g., name@upi)" class="w-full p-3 bg-gray-800 border-2 border-gray-700 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-red-500 transition-all">
                    <p class="text-xs text-gray-500 mt-2">Enter your UPI ID to complete payment</p>
                </div>

                <!-- Buttons -->
                <div class="flex gap-3">
                    <button onclick="closePaymentModal()" class="flex-1 p-3 bg-gray-800 border border-gray-700 text-white rounded-lg hover:bg-gray-700 transition-all font-semibold">
                        Cancel
                    </button>
                    <button onclick="processPayment()" id="pay-btn" class="flex-1 p-3 bg-gradient-to-r from-red-600 to-red-700 text-white rounded-lg font-bold hover:from-red-700 hover:to-red-800 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="inline h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                        </svg>
                        Pay Now
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 opacity-0 -translate-y-10 pointer-events-none">
        <div id="modal-content" class="glass-effect rounded-xl p-8 w-full max-w-sm text-center">
            <h3 class="text-xl font-bold text-white mb-2">Booking Successful!</h3>
            <p id="modal-text" class="text-gray-300 mb-6"></p>
            <button id="modal-close" class="btn-gradient text-white font-bold py-2 px-6 rounded-lg hover:opacity-90 transition-opacity">Close</button>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const seatContainer = document.getElementById('seat-container');
            const seatCountEl = document.getElementById('seat-count');
            const totalPriceEl = document.getElementById('total-price');
            const bookButton = document.getElementById('book-button');
            const clearButton = document.getElementById('clear-button');
            const timingSlots = document.querySelectorAll('.timing-slot');
            const selectedSeatsInfo = document.getElementById('selected-seats-info');
            const modal = document.getElementById('modal');
            const modalText = document.getElementById('modal-text');
            const modalClose = document.getElementById('modal-close');
            const legendContainer = document.getElementById('legend');
            const PREMIUM_PRICE = 18;
            const STANDARD_PRICE = 12;
            const seatLayout = [
                "SS_SSSSSSSSSS_SS", "SS_SSSSSSSSSS_SS", "SS_SSSSSSSSSS_SS",
                "SS_SSSSSSSSSS_SS", "PP_PPPPPPPP_PP", "PP_PPPPPPPP_PP", "PP_PPPPPPPP_PP",
            ];
            
            const defaultOccupiedSeats = {
                '06:30': ['A1', 'B5', 'C12', 'D9', 'E6', 'F11', 'G2'],
                '10:30': ['A3', 'B6', 'C5', 'D8', 'E2', 'F10', 'G4'],
                '14:00': ['A8', 'B2', 'C10', 'D3', 'E7', 'F5', 'G12', 'G1'],
            };

            let occupiedSeats = [];
            let selectedTime = '';

            const createSeatIconSVG = (seatId) => {
                const textEl = seatId ? `<text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle" font-size="8px" font-weight="bold" class="seat-number">${seatId}</text>` : '';
                return `<svg viewBox="0 0 24 24" class="w-full h-full fill-current">
                            <path d="M21.5,8.5h-2.29l-0.45-3.81C18.6,3.7,17.74,3,16.75,3H7.25C6.26,3,5.4,3.7,5.24,4.69L4.79,8.5H2.5C2.22,8.5,2,8.72,2,9v5c0,0.28,0.22,0.5,0.5,0.5H4v3.5C4,18.88,4.62,19.5,5.5,19.5h1C6.78,19.5,7,19.22,7,18.9V18h10v0.9c0,0.32,0.22,0.6,0.5,0.6h1c0.88,0,1.5-0.62,1.5-1.5V14.5h1.5c0,0.28,0.5-0.22,0.5-0.5V9C22,8.72,21.78,8.5,21.5,8.5z"></path>
                            ${textEl}
                        </svg>`;
            };

            const generateStorageKey = (time) => `quickShow_occupiedSeats_${time.replace(':', '')}`;
            
            const showModal = (message) => {
                modalText.textContent = message;
                modal.classList.remove('opacity-0', '-translate-y-10', 'pointer-events-none');
            };

            const hideModal = () => {
                modal.classList.add('opacity-0', '-translate-y-10', 'pointer-events-none');
            };

            const generateSeatMap = () => {
                let seatHTML = '';
                seatLayout.forEach((rowLayout, rowIndex) => {
                    const rowLetter = String.fromCharCode(65 + rowIndex);
                    let seatCounter = 1;
                    let rowDiv = '<div class="flex justify-center gap-2 md:gap-3 lg:gap-3 mb-3">';

                    for (const seatType of rowLayout) {
                        if (seatType === '_') {
                            rowDiv += `<div class="w-8 h-8 sm:w-9 sm:h-9 md:w-10 md:h-10 lg:w-10 lg:h-10"></div>`;
                        } else {
                            const seatId = `${rowLetter}${seatCounter}`;
                            const isOccupied = occupiedSeats.includes(seatId);
                            const type = seatType === 'P' ? 'premium' : 'standard';
                            const price = seatType === 'P' ? PREMIUM_PRICE : STANDARD_PRICE;

                            let seatClass = 'seat';
                            if (isOccupied) {
                                seatClass += ' occupied text-gray-800 cursor-not-allowed';
                            } else {
                                seatClass += type === 'premium' 
                                    ? ' premium text-yellow-500 hover:text-yellow-400' 
                                    : ' standard text-gray-600 hover:text-gray-500';
                            }
                            
                            rowDiv += `<div class="${seatClass}" data-id="${seatId}" data-price="${price}" data-type="${type}">${createSeatIconSVG(seatId)}</div>`;
                            seatCounter++;
                        }
                    }
                    rowDiv += '</div>';
                    seatHTML += rowDiv;
                });
                seatContainer.innerHTML = seatHTML;
                
                document.querySelectorAll('.seat').forEach(seat => {
                     seat.classList.add( 'w-8', 'h-8', 'sm:w-9', 'sm:h-9', 'md:w-10', 'md:h-10', 'lg:w-10', 'lg:h-10', 'flex', 'items-center', 'justify-center', 'cursor-pointer');
                });
            };

            const generateLegend = () => {
                const legendItems = [
                    { label: 'Premium', class: 'text-yellow-500' },
                    { label: 'Standard', class: 'text-gray-600' },
                    { label: 'Selected (Premium)', class: 'text-orange-500' },
                    { label: 'Selected (Standard)', class: 'text-red-500' },
                    { label: 'Occupied', class: 'text-gray-800' }
                ];
                let legendHTML = '';
                legendItems.forEach(item => {
                    legendHTML += `<div class="flex items-center space-x-2">
                                        <div class="w-5 h-5 ${item.class}">${createSeatIconSVG('')}</div>
                                        <span class="text-xs text-gray-400">${item.label}</span>
                                    </div>`;
                });
                legendContainer.innerHTML = legendHTML;
            };
            
            const updateSummary = () => {
                const selectedSeats = document.querySelectorAll('.seat.selected');
                let totalPrice = 0;
                const selectedSeatIds = Array.from(selectedSeats).map(seat => {
                    totalPrice += parseInt(seat.dataset.price);
                    return seat.dataset.id;
                });

                seatCountEl.textContent = selectedSeats.length;
                totalPriceEl.textContent = totalPrice;
                selectedSeatsInfo.textContent = selectedSeatIds.length > 0 ? selectedSeatIds.join(', ') : '';
                bookButton.disabled = selectedSeats.length === 0;
                clearButton.disabled = selectedSeats.length === 0;
            };

            const loadSeatsForTime = (time) => {
                selectedTime = time;
                const storageKey = generateStorageKey(time);
                occupiedSeats = JSON.parse(localStorage.getItem(storageKey)) || defaultOccupiedSeats[time];
                generateSeatMap();
                updateSummary();
            };

            seatContainer.addEventListener('click', (e) => {
                const seat = e.target.closest('.seat');
                if (seat && !seat.classList.contains('occupied')) {
                    seat.classList.toggle('selected');
                    seat.classList.add('seat-pop');
                    seat.addEventListener('animationend', () => seat.classList.remove('seat-pop'), { once: true });
                    
                    seat.classList.remove('text-yellow-500', 'hover:text-yellow-400', 'text-gray-600', 'hover:text-gray-500', 'text-red-500', 'text-orange-500');
                    
                    if (seat.classList.contains('selected')) {
                        seat.classList.add(seat.dataset.type === 'premium' ? 'text-orange-500' : 'text-red-500');
                    } else {
                        seat.classList.add(
                            seat.dataset.type === 'premium' ? 'text-yellow-500' : 'text-gray-600',
                            seat.dataset.type === 'premium' ? 'hover:text-yellow-400' : 'hover:text-gray-500'
                        );
                    }
                    updateSummary();
                }
            });
            
            clearButton.addEventListener('click', () => {
                loadSeatsForTime(selectedTime);
            });

            bookButton.addEventListener('click', () => {
                const selectedSeats = document.querySelectorAll('.seat.selected');
                if (selectedSeats.length === 0) return;

                const selectedSeatIds = Array.from(selectedSeats).map(seat => seat.dataset.id);
                let totalPrice = 0;
                Array.from(selectedSeats).forEach(seat => {
                    totalPrice += parseInt(seat.dataset.price);
                });

                // Open payment modal
                openPaymentModal(selectedSeatIds, totalPrice);
            });

            // Payment Modal Functions
            let pendingBooking = null;

            window.openPaymentModal = function(seatIds, totalPrice) {
                pendingBooking = {
                    seats: seatIds,
                    total: totalPrice
                };

                document.getElementById('payment-time').textContent = selectedTime;
                document.getElementById('payment-seats').textContent = seatIds.join(', ');
                document.getElementById('payment-total').textContent = '$' + totalPrice;
                document.getElementById('upi-id').value = '';

                const paymentModal = document.getElementById('payment-modal');
                paymentModal.classList.remove('hidden');
                paymentModal.classList.add('flex');
            };

            window.closePaymentModal = function() {
                const paymentModal = document.getElementById('payment-modal');
                paymentModal.classList.add('hidden');
                paymentModal.classList.remove('flex');
                document.getElementById('upi-id').value = '';
                pendingBooking = null;
            };

            window.processPayment = function() {
                if (!pendingBooking) return;

                const upiId = document.getElementById('upi-id').value.trim();
                
                if (!upiId || !upiId.includes('@')) {
                    alert('Please enter a valid UPI ID (e.g., name@upi)');
                    return;
                }

                const payBtn = document.getElementById('pay-btn');
                payBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="inline animate-spin h-5 w-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>Processing...';
                payBtn.disabled = true;

                // Process payment after 1.5 seconds
                setTimeout(() => {
                    const username = localStorage.getItem('username') || 'Guest';
                    
                    // Store values before clearing pendingBooking
                    const bookedSeats = pendingBooking.seats.join(', ');
                    const paidAmount = pendingBooking.total;
                    
                    // Create booking data
                    const bookingData = {
                        id: Date.now(),
                        username: username,
                        movieTitle: 'Deadpool & Wolverine',
                        poster: '../images/deadpool.jpeg',
                        date: new Date().toLocaleDateString('en-US'),
                        time: selectedTime,
                        theater: 'CineBook Cinema Hall 1',
                        seats: pendingBooking.seats.sort(),
                        ticketCount: pendingBooking.seats.length,
                        amount: pendingBooking.total,
                        bookingDate: new Date().toLocaleString('en-US'),
                        status: 'Confirmed',
                        paymentMethod: 'UPI'
                    };

                    // Save to my_tickets
                    const myTickets = JSON.parse(localStorage.getItem('my_tickets')) || [];
                    myTickets.push(bookingData);
                    localStorage.setItem('my_tickets', JSON.stringify(myTickets));

                    // Save to bookedTickets
                    const bookedTickets = JSON.parse(localStorage.getItem('bookedTickets')) || [];
                    bookedTickets.push(bookingData);
                    localStorage.setItem('bookedTickets', JSON.stringify(bookedTickets));

                    // Mark seats as occupied
                    occupiedSeats = [...occupiedSeats, ...pendingBooking.seats];
                    localStorage.setItem(generateStorageKey(selectedTime), JSON.stringify(occupiedSeats));
                    
                    // Update seats immediately
                    generateSeatMap();
                    updateSummary();

                    // Reset button
                    payBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="inline h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" /></svg>Pay Now';
                    payBtn.disabled = false;

                    // Close payment modal
                    closePaymentModal();
                    
                    // Show success modal with stored values
                    showModal(`✅ Payment Successful!\n\n$${paidAmount} paid via UPI\nSeats: ${bookedSeats}\n\nYou can book more tickets!`);
                }, 1500);
            };
            
            modalClose.addEventListener('click', hideModal);

            timingSlots.forEach(slot => {
                slot.addEventListener('click', () => {
                    timingSlots.forEach(s => {
                        s.classList.remove('selected', 'bg-red-600', 'text-white', 'font-semibold', 'shadow-lg', 'shadow-red-500/20');
                        s.classList.add('hover:bg-gray-700/50');
                    });
                    slot.classList.add('selected', 'bg-red-600', 'text-white', 'font-semibold', 'shadow-lg', 'shadow-red-500/20');
                    slot.classList.remove('hover:bg-gray-700/50');

                    const newTime = slot.dataset.time;
                    loadSeatsForTime(newTime);
                });
            });
            
            generateLegend();
            const initialTime = document.querySelector('.timing-slot.selected').dataset.time;
            loadSeatsForTime(initialTime);
        });
    </script>
</body>
</html>
