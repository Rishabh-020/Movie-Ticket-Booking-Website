<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In/Sign-Up</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/modal.css">
</head>
<body>
    <div class="form-container">
        <div class="col col-1">
            <div class="image-layer">
                <img src="../images/white-outline.png" alt="" class="form-image-main">
                <img src="../images/dots.png" alt="" class="form-image dots">
                <img src="../images/Camera.png" alt="" class="form-image rocket">
            </div>
            <p class="featured-words">You Are Few Minutes Away to Buy The Ticket</p>
        </div>
        <div class="col col-2">
            <div class="btn-box">
                <button class="btn btn-1" id="login" onclick="toggle()">Sign In</button>
                <button class="btn btn-2" id="register" onclick="toggle()">Sign Up</button>
            </div>
            <div class="login-form">
                <div class="form-title">
                    <span>Sign-In</span>
                </div>
                <div class="form-inputs">
                    <form>
                    <div class="input-box">
                        <input type="text" name="" id="loginUsername" class="input-field" placeholder="Username" required>
                        <i class="bx bx-user icon"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="loginPassword" class="input-field" placeholder="Password" required>
                        <i class="bx bx-lock-alt icon lockIcon"></i>
                        <i class="bx bx-show eye-icon togglePassword"></i>
                    </div>
                    <div class="forgot-pass">
                        <a href="#">Forgot Password?</a>
                    </div>
                    <div class="input-box">
                        <button class="input-submit" id="loginSubmit" type="button">
                            <span>Sign In</span>
                            <i class="bx bx-right-arrow-alt"></i>
                        </button>
                    </div>
                    </form>
                </div>
                <div class="social-login">
                    <i class="bx bxl-google"></i>
                    <i class="bx bxl-facebook"></i>
                    <i class="bx bxl-twitter"></i>
                </div>
            </div>
            <div class="register-form">
                <div class="form-title">
                    <span>Create Account</span>
                </div>
                <div class="form-inputs">
                    <form action="">
                    <div class="input-box">
                        <input type="text" name="" id="registerUsername" class="input-field" placeholder="Username" required>
                        <i class="bx bx-user icon"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" name="" id="registerPassword" class="input-field" placeholder="Password" required>
                        <i class="bx bx-lock-alt icon lockIcon"></i>
                        <i class="bx bx-show eye-icon togglePassword"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="registerConfirmPassword" class="input-field" placeholder="Confirm Password" required>
                        <i class="bx bx-lock-alt icon lockIcon"></i>
                        <i class="bx bx-show eye-icon togglePassword"></i>
                    </div>
                    <div class="input-box">
                        <button class="input-submit" id="registerSubmit" type="button">
                            <span>Sign Up</span>
                            <i class="bx bx-right-arrow-alt"></i>
                        </button>
                    </div>
                    </form>
                </div>
                <div class="social-login">
                    <i class="bx bxl-google"></i>
                    <i class="bx bxl-facebook"></i>
                    <i class="bx bxl-twitter"></i>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/modal.js"></script>
    <script src="../js/Login.js"></script>
</body>
</html>
