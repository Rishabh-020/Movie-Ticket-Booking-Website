<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CineBook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #18181b; /* Lighter base color */
            background-image:
                radial-gradient(ellipse 80% 90% at 10% 50%, rgba(37, 99, 235, 0.2), transparent 70%), /* Increased opacity */
                radial-gradient(ellipse 50% 60% at 90% 90%, rgba(37, 99, 235, 0.25), transparent 70%); /* Increased opacity */
            background-attachment: fixed;
        }
        .glass-effect {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-gradient {
            background-image: linear-gradient(to right, #4f46e5, #3b82f6);
        }
        .btn-gradient:hover {
            background-image: linear-gradient(to right, #3b82f6, #2563eb);
        }
        .btn-danger {
            background-image: linear-gradient(to right, #ef4444, #dc2626);
        }
        .btn-danger:hover {
            background-image: linear-gradient(to right, #dc2626, #b91c1c);
        }
        #confirm-modal {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="text-gray-300">

    <main class="container mx-auto px-4 py-8 md:py-12">
        <header class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-white">Admin Ticket Management</h1>
            <p class="text-gray-400 mt-2">View and manage all booked seats for all showtimes.</p>
        </header>

        <div id="tickets-container" class="max-w-4xl mx-auto space-y-8">
            <!-- Tickets will be dynamically inserted here -->
        </div>

        <div class="text-center mt-12 flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="../Fee Project 3rd Sem/html/seatIcon.html" class="btn-gradient w-full sm:w-auto inline-block text-white font-bold py-3 px-8 rounded-lg transition-all duration-300 transform hover:scale-105">
                Back to Seat Selection
            </a>
            <button id="clear-all-button" class="btn-danger w-full sm:w-auto inline-block text-white font-bold py-3 px-8 rounded-lg transition-all duration-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
                Clear All Bookings
            </button>
        </div>
    </main>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 opacity-0 -translate-y-10 pointer-events-none z-50">
        <div id="modal-content" class="glass-effect rounded-xl p-8 w-full max-w-sm text-center">
            <h3 class="text-xl font-bold text-white mb-2">Are you sure?</h3>
            <p id="confirm-modal-text" class="text-gray-300 mb-6">This action cannot be undone.</p>
            <div class="flex justify-center gap-4">
                 <button id="confirm-modal-cancel" class="bg-gray-700 text-white font-bold py-2 px-6 rounded-lg hover:bg-gray-600 transition-colors duration-300">Cancel</button>
                <button id="confirm-modal-confirm" class="btn-danger text-white font-bold py-2 px-6 rounded-lg hover:opacity-90 transition-opacity">Confirm</button>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ticketsContainer = document.getElementById('tickets-container');
            const clearAllButton = document.getElementById('clear-all-button');
            const confirmModal = document.getElementById('confirm-modal');
            const confirmModalText = document.getElementById('confirm-modal-text');
            const confirmModalConfirm = document.getElementById('confirm-modal-confirm');
            const confirmModalCancel = document.getElementById('confirm-modal-cancel');
            
            const showTimes = ['06:30', '10:30', '14:00'];

            const generateStorageKey = (time) => `cineBook_occupiedSeats_${time.replace(':', '')}`;
            
            const formatTime = (time) => {
                const [hour, minute] = time.split(':');
                const hourInt = parseInt(hour);
                const ampm = hourInt >= 12 ? 'PM' : 'AM';
                const formattedHour = hourInt % 12 === 0 ? 12 : hourInt % 12;
                return `${formattedHour.toString().padStart(2, '0')}:${minute} ${ampm}`;
            };

            const showConfirmModal = (message, onConfirm) => {
                confirmModalText.textContent = message;
                confirmModal.classList.remove('opacity-0', '-translate-y-10', 'pointer-events-none');
                
                const newConfirmButton = confirmModalConfirm.cloneNode(true);
                confirmModalConfirm.parentNode.replaceChild(newConfirmButton, confirmModalConfirm);

                newConfirmButton.addEventListener('click', () => {
                    onConfirm();
                    hideConfirmModal();
                }, { once: true });

                confirmModalCancel.addEventListener('click', hideConfirmModal, { once: true });
            };

            const hideConfirmModal = () => {
                confirmModal.classList.add('opacity-0', '-translate-y-10', 'pointer-events-none');
            };

            const cancelTicket = (time, seatId, ticketElement) => {
                const occupiedSeatsKey = generateStorageKey(time);
                let occupiedSeats = JSON.parse(localStorage.getItem(occupiedSeatsKey)) || [];
                occupiedSeats = occupiedSeats.filter(seat => seat !== seatId);
                localStorage.setItem(occupiedSeatsKey, JSON.stringify(occupiedSeats));
                let myTickets = JSON.parse(localStorage.getItem('my_tickets')) || [];
                myTickets = myTickets
                    .map(booking => {
                        if (booking.time === time) {
                            booking.seats = booking.seats.filter(seat => seat !== seatId);
                        }
                        return booking;
                    })
                    .filter(booking => booking.seats.length > 0); // Remove booking if no seats are left

                localStorage.setItem('my_tickets', JSON.stringify(myTickets));

                // 3. Update the DOM without a full re-render
                const showtimeCard = ticketElement.closest('.glass-effect');
                ticketElement.remove(); // Remove the specific ticket element

                // 4. Update the ticket count for that showtime
                const ticketCountSpan = showtimeCard.querySelector('span.bg-blue-600\\/50');
                const currentSeats = showtimeCard.querySelectorAll('.cancel-ticket-btn').length;
                ticketCountSpan.textContent = `${currentSeats} Ticket(s)`;

                // 5. If it was the last ticket, show the "no tickets" message within the card
                if (currentSeats === 0) {
                    const gridContainer = showtimeCard.querySelector('.grid');
                    if(gridContainer) gridContainer.remove();
                    showtimeCard.insertAdjacentHTML('beforeend', `<p class="text-center text-gray-400 py-4">No user-booked tickets for this showtime.</p>`);
                }

                // 6. Check if any tickets are left at all and update global UI
                const totalBookedSeats = myTickets.reduce((acc, booking) => acc + booking.seats.length, 0);
                if (totalBookedSeats === 0) {
                    renderAllTickets(); // Re-render to show the main "No Bookings Found" message
                } else {
                    clearAllButton.disabled = false;
                }
            };

            const renderAllTickets = () => {
                ticketsContainer.innerHTML = ''; // Clear current view
                let totalBookedSeats = 0;

                showTimes.forEach(time => {
                    const myTickets = JSON.parse(localStorage.getItem('my_tickets')) || [];
                    const userBookedSeatsForTime = myTickets
                        .filter(ticket => ticket.time === time)
                        .flatMap(ticket => ticket.seats);

                    totalBookedSeats += userBookedSeatsForTime.length;

                    const showtimeCard = document.createElement('div');
                    showtimeCard.className = 'glass-effect rounded-xl p-6';

                    let contentHTML = `
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-xl font-semibold text-white">Showtime: ${formatTime(time)}</h2>
                            <span class="text-sm font-medium bg-blue-600/50 text-blue-200 py-1 px-3 rounded-full">${userBookedSeatsForTime.length} Ticket(s)</span>
                        </div>
                    `;

                    if (userBookedSeatsForTime.length > 0) {
                        contentHTML += '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">';
                        
                        userBookedSeatsForTime.sort((a, b) => {
                            const rowA = a.charAt(0);
                            const rowB = b.charAt(0);
                            const numA = parseInt(a.substring(1));
                            const numB = parseInt(b.substring(1));
                            if (rowA < rowB) return -1;
                            if (rowA > rowB) return 1;
                            return numA - numB;
                        });
                        
                        userBookedSeatsForTime.forEach(seatId => {
                            contentHTML += `
                                <div class="bg-gray-800/50 border border-gray-700 rounded-lg p-2 flex items-center justify-between text-sm font-semibold">
                                    <span>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block mr-2 text-blue-400" viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 11a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                                        ${seatId}
                                    </span>
                                    <button class="cancel-ticket-btn text-red-500 hover:text-red-400 p-1" data-time="${time}" data-seat="${seatId}">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" /></svg>
                                    </button>
                                </div>
                            `;
                        });
                        contentHTML += '</div>';
                    } else {
                        contentHTML += `<p class="text-center text-gray-400 py-4">No user-booked tickets for this showtime.</p>`;
                    }

                    showtimeCard.innerHTML = contentHTML;
                    ticketsContainer.appendChild(showtimeCard);
                });
                
                if (totalBookedSeats === 0) {
                    ticketsContainer.innerHTML = `<div class="glass-effect rounded-xl p-8 text-center">
                        <h2 class="text-xl font-bold text-white">No Bookings Found</h2>
                        <p class="text-gray-400 mt-2">No tickets have been booked by users yet.</p>
                    </div>`;
                    clearAllButton.disabled = true;
                } else {
                    clearAllButton.disabled = false;
                }
            };
            
            ticketsContainer.addEventListener('click', (e) => {
                const cancelButton = e.target.closest('.cancel-ticket-btn');
                if (cancelButton) {
                    const time = cancelButton.dataset.time;
                    const seatId = cancelButton.dataset.seat;
                    const ticketElement = cancelButton.closest('.bg-gray-800\\/50');
                    
                    showConfirmModal(
                        `Are you sure you want to cancel the ticket for seat ${seatId} at ${formatTime(time)}?`,
                        () => cancelTicket(time, seatId, ticketElement)
                    );
                }
            });

            clearAllButton.addEventListener('click', () => {
                showConfirmModal(
                    'This will permanently delete ALL user-booked tickets. Are you sure?',
                    () => {
                        showTimes.forEach(time => {
                            const storageKey = generateStorageKey(time);
                            localStorage.removeItem(storageKey);
                        });
                        localStorage.removeItem('my_tickets');
                        renderAllTickets();
                    }
                );
            });
            
            renderAllTickets();
        });
    </script>
</body>
</html>
