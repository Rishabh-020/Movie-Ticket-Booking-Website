<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickShow - Seat Selection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            background-image:
                radial-gradient(ellipse 80% 90% at 10% 50%, rgba(220, 38, 38, 0.15), transparent 70%),
                radial-gradient(ellipse 50% 60% at 90% 90%, rgba(220, 38, 38, 0.2), transparent 70%),
                radial-gradient(ellipse 100% 50% at 50% 0%, rgba(220, 38, 38, 0.1), transparent 60%);
            background-attachment: fixed;
        }
        .screen-arc {
            width: 80%;
            max-width: 500px;
            height: 50px;
            border-top: 3px solid #ef4444;
            border-radius: 50% / 100% 100% 0 0;
            transform: rotateX(-30deg) scale(1.1);
            box-shadow: 0 5px 30px -5px rgba(239, 68, 68, 0.5);
        }
        .seat {
            transition: all 0.2s ease-in-out;
        }
        .glass-effect {
            background: rgba(26, 26, 26, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #seat-map::-webkit-scrollbar {
            display: none;
        }
        #seat-map {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .seat-pop {
            animation: pop 0.2s ease-out;
        }
        #modal {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
    </style>
</head>
<body class="text-gray-300 flex items-center justify-center min-h-screen">

    <main class="container mx-auto px-4 py-6 md:py-10 flex flex-col lg:flex-row gap-8 md:gap-12 w-full">
        
        <aside class="w-full lg:w-1/4 lg:max-w-xs flex-shrink-0">
            <div class="glass-effect rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-6 text-white">Available Timings</h2>
                <div class="space-y-4">
                    <!-- Added data-time attribute to uniquely identify each time slot -->
                    <div class="timing-slot flex items-center space-x-3 p-3 rounded-lg cursor-pointer hover:bg-gray-700/50 transition-colors" data-time="06:30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span>06:30 AM</span>
                    </div>
                    <div class="timing-slot selected flex items-center space-x-3 p-3 rounded-lg cursor-pointer bg-red-500 text-white font-semibold" data-time="10:30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span>10:30 AM</span>
                    </div>
                    <div class="timing-slot flex items-center space-x-3 p-3 rounded-lg cursor-pointer hover:bg-gray-700/50 transition-colors" data-time="14:00">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <span>02:00 PM</span>
                    </div>
                </div>
            </div>
        </aside>

        <section class="w-full lg:w-3/4 flex flex-col items-center">
            <h1 class="text-2xl md:text-3xl font-bold text-white mb-8 text-center">Select Your Seat</h1>
            
            <div class="screen-container w-full flex flex-col items-center mb-12 md:mb-16 space-y-2">
                <div class="screen-arc"></div>
                <p class="text-xs sm:text-sm font-medium text-gray-400 tracking-widest">SCREEN</p>
            </div>

            <div id="seat-map" class="w-full max-w-4xl overflow-x-auto pb-2 text-center">
                 <div id="seat-container" class="py-4 px-6 inline-block min-w-max">
                    <!-- Seats will be generated here by JavaScript -->
                 </div>
            </div>

            <div class="mt-12 md:mt-16 w-full max-w-3xl flex flex-col items-center gap-6">
                <div class="flex flex-wrap justify-center items-center gap-x-4 sm:gap-x-6 gap-y-3">
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 md:w-4 md:h-4 bg-yellow-500 rounded-md border border-yellow-400"></div>
                        <span class="text-xs">Premium</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 md:w-4 md:h-4 bg-gray-600 rounded-md border border-gray-500"></div>
                        <span class="text-xs">Standard</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 md:w-4 md:h-4 bg-orange-500 rounded-md border border-orange-400"></div>
                        <span class="text-xs">Selected (Premium)</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 md:w-4 md:h-4 bg-red-500 rounded-md border border-red-400"></div>
                        <span class="text-xs">Selected (Standard)</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-5 h-5 md:w-4 md:h-4 bg-gray-800 rounded-md border border-gray-700"></div>
                        <span class="text-xs">Occupied</span>
                    </div>
                </div>
                
                <div id="summary" class="glass-effect rounded-lg p-4 w-full text-center flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                        <span>You have selected <strong class="text-red-500" id="seat-count">0</strong> seats.</span>
                        <div class="text-xs text-gray-400 h-4 mt-1" id="selected-seats-info"></div>
                    </div>
                    <div class="text-lg font-semibold text-white">
                        Total Price: $<span id="total-price">0</span>
                    </div>
                </div>

                <div class="w-full max-w-sm flex flex-col sm:flex-row gap-4">
                    <button id="book-button" class="w-full bg-red-500 text-white font-bold py-3 px-8 rounded-lg hover:bg-red-600 transition-all duration-300 transform hover:scale-105 disabled:bg-red-800 disabled:cursor-not-allowed disabled:scale-100">
                        Book Tickets
                    </button>
                    <button id="clear-button" class="w-full bg-gray-600 text-white font-bold py-3 px-8 rounded-lg hover:bg-gray-500 transition-all duration-300 disabled:bg-gray-800 disabled:cursor-not-allowed">
                        Clear Selection
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 opacity-0 -translate-y-10 pointer-events-none">
        <div id="modal-content" class="glass-effect rounded-lg p-6 w-full max-w-sm text-center">
            <h3 class="text-lg font-bold text-white mb-2">Booking Successful!</h3>
            <p id="modal-text" class="text-gray-300 mb-6"></p>
            <button id="modal-close" class="bg-red-500 text-white font-bold py-2 px-6 rounded-lg hover:bg-red-600 transition-colors">Close</button>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const seatContainer = document.getElementById('seat-container');
            const seatCountEl = document.getElementById('seat-count');
            const totalPriceEl = document.getElementById('total-price');
            const bookButton = document.getElementById('book-button');
            const clearButton = document.getElementById('clear-button');
            const timingSlots = document.querySelectorAll('.timing-slot');
            const selectedSeatsInfo = document.getElementById('selected-seats-info');
            const modal = document.getElementById('modal');
            const modalText = document.getElementById('modal-text');
            const modalClose = document.getElementById('modal-close');

            const PREMIUM_PRICE = 18;
            const STANDARD_PRICE = 12;
            const seatLayout = [
                "SS_SSSSSSSSSS_SS", "SS_SSSSSSSSSS_SS", "SS_SSSSSSSSSS_SS",
                "SS_SSSSSSSSSS_SS", "PP_PPPPPPPP_PP", "PP_PPPPPPPP_PP", "PP_PPPPPPPP_PP",
            ];
            
            // NEW: Default occupied seats for each time slot
            const defaultOccupiedSeats = {
                '06:30': ['A1', 'B5', 'C12', 'D9', 'E6', 'F11', 'G2'],
                '10:30': ['A3', 'B6', 'C5', 'D8', 'E2', 'F10', 'G4'],
                '14:00': ['A8', 'B2', 'C10', 'D3', 'E7', 'F5', 'G12', 'G1'],
            };

            let occupiedSeats = [];
            let selectedTime = '';

            const generateStorageKey = (time) => `quickShow_occupiedSeats_${time.replace(':', '')}`;
            
            const showModal = (message) => {
                modalText.textContent = message;
                modal.classList.remove('opacity-0', '-translate-y-10', 'pointer-events-none');
            };

            const hideModal = () => {
                modal.classList.add('opacity-0', '-translate-y-10', 'pointer-events-none');
            };

            const generateSeatMap = () => {
                let seatHTML = '';
                seatLayout.forEach((rowLayout, rowIndex) => {
                    const rowLetter = String.fromCharCode(65 + rowIndex);
                    let seatCounter = 1;
                    let rowDiv = '<div class="flex justify-center gap-3 md:gap-4 mb-4">';

                    for (const seatType of rowLayout) {
                        if (seatType === '_') {
                            // TASK 1: Adjusted aisle spacer size for laptop screens
                            rowDiv += `<div class="w-8 h-8 sm:w-9 sm:h-9 md:w-10 md:h-10 lg:w-9 lg:h-9"></div>`;
                        } else {
                            const seatId = `${rowLetter}${seatCounter}`;
                            const isOccupied = occupiedSeats.includes(seatId);
                            const type = seatType === 'P' ? 'premium' : 'standard';
                            const price = seatType === 'P' ? PREMIUM_PRICE : STANDARD_PRICE;

                            let seatClass = 'seat';
                            if (isOccupied) {
                                seatClass += ' occupied bg-gray-800 text-gray-600 cursor-not-allowed';
                            } else {
                                seatClass += type === 'premium' 
                                    ? ' premium bg-yellow-500 hover:bg-yellow-400 text-gray-900' 
                                    : ' standard bg-gray-600 hover:bg-gray-500 text-gray-300';
                            }
                            
                            rowDiv += `<div class="${seatClass}" data-id="${seatId}" data-price="${price}" data-type="${type}">${seatId}</div>`;
                            seatCounter++;
                        }
                    }
                    rowDiv += '</div>';
                    seatHTML += rowDiv;
                });
                seatContainer.innerHTML = seatHTML;
                
                document.querySelectorAll('.seat').forEach(seat => {
                     // TASK 1: Added lg:w-9 and lg:h-9 to make seats slightly smaller on laptop screens
                     seat.classList.add(
                        'w-8', 'h-8', 'sm:w-9', 'sm:h-9', 'md:w-10', 'md:h-10', 'lg:w-9', 'lg:h-9',
                        'flex', 'items-center', 'justify-center',
                        'text-xs', 'font-semibold', 'rounded-md', 'cursor-pointer'
                     );
                });
            };
            
            const updateSummary = () => {
                const selectedSeats = document.querySelectorAll('.seat.selected');
                let totalPrice = 0;
                const selectedSeatIds = Array.from(selectedSeats).map(seat => {
                    totalPrice += parseInt(seat.dataset.price);
                    return seat.dataset.id;
                });

                seatCountEl.textContent = selectedSeats.length;
                totalPriceEl.textContent = totalPrice;
                selectedSeatsInfo.textContent = selectedSeatIds.length > 0 ? selectedSeatIds.join(', ') : '';
                bookButton.disabled = selectedSeats.length === 0;
                clearButton.disabled = selectedSeats.length === 0;
            };

            // NEW: Function to load seats for a specific time
            const loadSeatsForTime = (time) => {
                selectedTime = time;
                const storageKey = generateStorageKey(time);
                occupiedSeats = JSON.parse(localStorage.getItem(storageKey)) || defaultOccupiedSeats[time];
                generateSeatMap();
                updateSummary();
            };

            seatContainer.addEventListener('click', (e) => {
                const seat = e.target;
                if (seat.classList.contains('seat') && !seat.classList.contains('occupied')) {
                    seat.classList.toggle('selected');
                    seat.classList.add('seat-pop');
                    seat.addEventListener('animationend', () => seat.classList.remove('seat-pop'), { once: true });
                    seat.classList.remove('bg-yellow-500', 'hover:bg-yellow-400', 'text-gray-900', 'bg-gray-600', 'hover:bg-gray-500', 'text-gray-300', 'bg-red-500', 'text-white', 'bg-orange-500');
                    if (seat.classList.contains('selected')) {
                        seat.classList.add(seat.dataset.type === 'premium' ? 'bg-orange-500' : 'bg-red-500', 'text-white');
                    } else {
                        seat.classList.add(seat.dataset.type === 'premium' ? 'bg-yellow-500' : 'bg-gray-600', seat.dataset.type === 'premium' ? 'hover:bg-yellow-400' : 'hover:bg-gray-500', seat.dataset.type === 'premium' ? 'text-gray-900' : 'text-gray-300');
                    }
                    updateSummary();
                }
            });
            
            clearButton.addEventListener('click', () => {
                document.querySelectorAll('.seat.selected').forEach(seat => {
                    seat.classList.remove('selected', 'bg-red-500', 'text-white', 'bg-orange-500');
                    if (seat.dataset.type === 'premium') {
                        seat.classList.add('bg-yellow-500', 'hover:bg-yellow-400', 'text-gray-900');
                    } else {
                        seat.classList.add('bg-gray-600', 'hover:bg-gray-500', 'text-gray-300');
                    }
                });
                updateSummary();
            });

            bookButton.addEventListener('click', () => {
                const selectedSeats = document.querySelectorAll('.seat.selected');
                if (selectedSeats.length === 0) return;

                const selectedSeatIds = Array.from(selectedSeats).map(seat => seat.dataset.id);
                occupiedSeats = [...occupiedSeats, ...selectedSeatIds];
                // TASK 2 & 3: Save to localStorage using the key for the currently selected time
                localStorage.setItem(generateStorageKey(selectedTime), JSON.stringify(occupiedSeats));
                showModal(`Tickets booked for seats: ${selectedSeatIds.join(', ')}`);
                generateSeatMap();
                updateSummary();
            });
            
            modalClose.addEventListener('click', hideModal);

            timingSlots.forEach(slot => {
                slot.addEventListener('click', () => {
                    timingSlots.forEach(s => {
                        s.classList.remove('selected', 'bg-red-500', 'text-white', 'font-semibold');
                        s.classList.add('hover:bg-gray-700/50');
                    });
                    slot.classList.add('selected', 'bg-red-500', 'text-white', 'font-semibold');
                    slot.classList.remove('hover:bg-gray-700/50');

                    // TASK 2: Load the seat map for the newly selected time
                    const newTime = slot.dataset.time;
                    loadSeatsForTime(newTime);
                });
            });

            // --- Initial Setup Call ---
            const initialTime = document.querySelector('.timing-slot.selected').dataset.time;
            loadSeatsForTime(initialTime);
        });
    </script>
</body>
</html>
