<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineBook Header</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif; /* Using a common font as 'Popine' might be a typo */
            margin: 0;
            background-color: #111;
            color: #fff;
            min-height: 200vh; /* Added to demonstrate sticky header */
        }

        header {
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 20px 20px;
            transition: background-color 0.3s ease, backdrop-filter 0.3s ease;
        }

        header.scrolled {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .logo span {
            color: #e50914;
        }

        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            position: relative;
            color: #fff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0;
            height: 2px;
            background-color: #e50914;
            transition: width 0.3s ease;
        }

        .nav-links a:hover {
            color: #e50914;
        }

        .nav-links a:hover::after {
            width: 100%;
        }
        
        /* --- MODIFIED/NEW STYLES --- */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px; /* Space between dropdown and login */
        }

        .location-selector {
            display: none; /* Hidden by default */
        }
        
        /* This is the rule that shows the dropdown when logged in */
        body.logged-in .location-selector {
            display: block;
        }

        .location-selector select {
            background-color: #222;
            color: #fff;
            padding: 8px 12px;
            border: 1px solid #444;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
        }
        /* --- END MODIFIED/NEW STYLES --- */


        .login-btn {
            padding: 10px 20px;
            font-size: 16px;
            background: linear-gradient(to right, #ff0000, #660000);
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-color: #f40612;
            transform: translateY(-2px);
        }

        .hamburger {
            display: none;
            font-size: 26px;
            cursor: pointer;
            color: white;
        }
        
        /* Hide the mobile-specific li by default */
        .mobile-login {
            display: none;
        }


        @media (max-width: 768px) {
            .nav-links {
                display: none; /* Hide nav links by default on mobile */
                flex-direction: column;
                align-items: center;
                position: absolute;
                top: 70px; /* Adjust based on header height */
                left: 0;
                width: 100%;
                background-color: rgba(0, 0, 0, 0.9);
                padding: 15px 0;
                max-height: 0;
                opacity: 0;
                overflow: hidden;
                transition: max-height 0.4s ease-out, opacity 0.4s ease-out, padding 0.4s ease-out;
            }

            .nav-links.show {
                display: flex;
                max-height: 500px;
                opacity: 1;
                padding: 15px 0;
            }

            .hamburger {
                display: block;
            }

            .nav-actions {
                display: none; /* Hide desktop actions on mobile */
            }

            /* Show mobile login/location container */
            .mobile-login {
                display: block;
                margin-top: 10px;
                padding-top: 10px;
                border-top: 1px solid #333;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body class=""> <!-- Starts as logged out -->
    <header>
        <nav class="navbar">
            <div class="logo">Cine<span>Book</span></div>
            <div class="hamburger" id="hamburger">☰</div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="movie.html">Movies</a></li>
                <li><a href="AboutUs.html">About</a></li>
                <li><a href="ContactUs.html">Contact Us</a></li>
                <li><a href="tickets.html">Booked Tickets</a></li>
                <li class="mobile-login">
                     <!-- Location selector for mobile -->
                    <div class="location-selector" style="margin-bottom: 10px;">
                        <select id="location-selector-mobile">
                            <option value="mumbai">Mumbai</option>
                            <option value="delhi">Delhi</option>
                            <option value="bangalore">Bangalore</option>
                        </select>
                    </div>
                    <!-- The single button for mobile -->
                    <button class="login-btn" id="auth-btn-mobile">Login</button>
                </li>
            </ul>
            <div class="nav-actions">
                 <!-- Location selector for desktop -->
                <div class="location-selector">
                    <select id="location-selector-desktop">
                        <option value="mumbai">Mumbai</option>
                        <option value="delhi">Delhi</option>
                        <option value="bangalore">Bangalore</option>
                    </select>
                </div>
                <!-- The single button for desktop -->
                <button class="login-btn" id="auth-btn-desktop">Login</button>
            </div>
        </nav>
    </header>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('nav-links');
            const header = document.querySelector('header');
            
            const authBtnDesktop = document.getElementById('auth-btn-desktop');
            const authBtnMobile = document.getElementById('auth-btn-mobile');

            // Hamburger menu toggle
            hamburger.addEventListener('click', function () {
                navLinks.classList.toggle('show');
            });

            // Scrolled effect for header
            window.addEventListener('scroll', function () {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            // Function to handle login/logout state
            function toggleAuthState() {
                const isLoggedIn = document.body.classList.toggle('logged-in');

                if (isLoggedIn) {
                    authBtnDesktop.textContent = 'Logout';
                    authBtnMobile.textContent = 'Logout';
                } else {
                    authBtnDesktop.textContent = 'Login';
                    authBtnMobile.textContent = 'Login';
                }
            }

            // Attach event listener to both buttons
            authBtnDesktop.addEventListener('click', toggleAuthState);
            authBtnMobile.addEventListener('click', toggleAuthState);
        });
    </script>
</body>
</html>
